<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>ChessAI Practice</title></head><body><header><h1>ChessAI</h1><span>2.3.0 · Practice</span></header><p id="status" role="status">Starting engine…</p><button id="panel">Open practice tab</button><main><section><h2 id="turn"></h2><div id="outcome" hidden></div><div class="boardrow"><div id="evalbar" aria-label="White evaluation"><div id="evalwhite"></div></div><div class="boardwrap"><div id="board" aria-label="Practice chessboard"></div><svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg></div></div><p id="evaluation">Evaluation: —</p><div><button id="undo">Undo</button><button id="reset">New game</button><button id="flip">Flip board</button></div></section><section class="analysis"><h2>Engine analysis</h2><label><input id="arrowsOn" type="checkbox" checked> Best move arrow</label><label><input id="auto" type="checkbox" checked> Automatic analysis</label><label>Mode <select id="mode"><option value="human">Practice both sides</option><option value="black">Play White vs AI</option><option value="white">Play Black vs AI</option><option value="both">AI vs AI</option></select></label><button id="analyse" disabled>Show moves</button><button id="stop">Stop AI</button><pre id="results" aria-live="polite"></pre><details><summary>Move history</summary><pre id="history"></pre></details><details><summary>Position and engine settings</summary><label for="fen">FEN</label><textarea id="fen" rows="3"></textarea><button id="load">Load FEN</button><label>Thinking time (seconds) <input id="time" type="number" min="1" max="30" value="3"></label><label>Depth <input id="depth" type="number" min="1" max="22" value="15"></label><label>Strength <input id="skill" type="number" min="0" max="20" value="20"></label></details></section></main><footer>Independent local practice board. No website connection.</footer><script src="engine-path.js"></script><script type="module" src="popup.js"></script></body></html>
