<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>ChessAI</title></head><body><header><h1>ChessAI</h1><span>v0.10.0 · BOT companion</span></header><nav><button id="assistant">AI Assistant</button><button id="auto">Auto Play</button></nav><section id="panel"><h2 id="heading"></h2><p id="description"></p><a id="launch" target="_blank" rel="noopener noreferrer"></a></section><details id="connection"><summary>Connection settings</summary><label for="port">Local board port</label><input id="port" type="text" placeholder="58818 or local URL" value="58818"><button id="open">Open local board</button><p id="status" role="status"></p><label for="key">Desktop pairing key</label><input id="key" type="password" autocomplete="off"></details><section id="analysis"><canvas id="preview" width="280" height="280" aria-label="Practice chessboard"></canvas><div id="eval" role="img" aria-label="Evaluation"><div id="whitebar"></div></div><button id="sync" aria-pressed="false">Follow local practice board</button><p id="syncstatus" role="status"></p><details><summary>Manual position and thinking time</summary><label for="fen">Practice position (FEN)</label><textarea id="fen" rows="3" style="width:100%">rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1</textarea><label for="seconds">Thinking time (seconds)</label><input id="seconds" type="number" min="0.1" max="5" step="0.1" value="1"></details><button id="analyse">Analyse practice position</button><pre id="results" style="white-space:pre-wrap"></pre></section><section id="botpanel" hidden><p>Dedicated Lichess BOT account only. Enter its token in the desktop Online BOT tab first.</p><label for="botskill">BOT engine strength (0–20)</label><input id="botskill" type="number" min="0" max="20" value="20"><button id="botstart">Start BOT</button> <button id="botstop">Stop BOT</button><p id="botstatus" role="status">Not connected</p><p id="botopponent"></p><a id="botwatch" hidden target="_blank" rel="noopener noreferrer">Watch game</a></section><footer>Stockfish runs in the desktop app. No live human-game assistance.</footer><script src="popup.js"></script></body></html>
